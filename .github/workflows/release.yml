name: Release

# Runs on every version bump: the version in package.json (and metadata.txt)
# has to change for a push to main to produce a release. A tag push
# (git tag v1.2.3 && git push origin v1.2.3) always releases, and
# workflow_dispatch can be run by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (read from package.json when left empty)'
        required: false

permissions:
  contents: write

concurrency:
  # A main push and a tag push can fire at the same time; a single queue
  # serialises them so they do not race (the second run updates the release).
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.value }}
      tag: ${{ steps.resolve.outputs.tag }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(node -p "require('./package.json').version")
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

          if [ "$EVENT" != "push" ]; then
            echo "changed=true (event: $EVENT)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag push is an explicit request to release that tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "changed=true (tag push: $GITHUB_REF_NAME)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show HEAD^:package.json 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "")

          if [ -z "$previous" ]; then
            echo "changed=true (no previous commit to compare against)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$previous" = "$version" ]; then
            echo "changed=false (version still $version, nothing to release)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true ($previous -> $version)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify metadata.txt version matches
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          meta=$(sed -n 's|^// @version[[:space:]]\+||p' metadata.txt)
          if [ "$meta" != "$VERSION" ]; then
            echo "::error::metadata.txt @version ($meta) != package.json ($VERSION)"
            exit 1
          fi

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          # A git tag and a GitHub release are different things. The tag can
          # already be pushed while no release exists for it yet, so ask gh
          # instead of looking at a git ref.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "release $TAG already exists, updating it"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "release $TAG not found, creating it"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:min

      - name: Verify dist output
        run: |
          artifact="dist/stremio-local-proxy-hls.user.js"
          if [ ! -s "$artifact" ]; then
            echo "::error::$artifact is missing or empty"
            exit 1
          fi
          echo "$(wc -c < "$artifact") bytes, $artifact"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          EXISTING: ${{ steps.existing.outputs.value }}
        run: |
          if [ "$EXISTING" = "true" ]; then
            gh release edit "$TAG" --title "v$VERSION" --notes-file release-notes.md
            gh release upload "$TAG" dist/*.user.js --clobber
            echo "updated: $TAG"
          else
            gh release create "$TAG" dist/*.user.js \
              --title "v$VERSION" \
              --notes-file release-notes.md
            echo "created: $TAG"
          fi
